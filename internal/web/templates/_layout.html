{{ define "layout" -}}
<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <script>
    // Theme flash avoidance: read the cookie or system preference and apply
    // before any CSS computes. The four themes are: light, dark, auto,
    // high-contrast (S10 wires the picker; S02 just enforces the contract).
    (function () {
      var match = document.cookie.match(/(?:^|; )theme=([^;]+)/);
      var theme = match ? decodeURIComponent(match[1]) : "auto";
      if (theme === "auto") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="shithub — GitHub. Open source. Without Copilot.">
  {{ if .OGTitle }}<meta property="og:title" content="{{ .OGTitle }}">{{ end }}
  {{ if .OGDescription }}<meta property="og:description" content="{{ .OGDescription }}">{{ end }}
  {{ if .OGImage }}<meta property="og:image" content="{{ .OGImage }}">{{ end }}
  <title>{{ .Title }} · shithub</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo/favicon.svg">
  <link rel="stylesheet" href="/static/primer/primer.css" onerror="this.remove()">
  <link rel="stylesheet" href="/static/css/shithub.css">
  <link rel="stylesheet" href="/static/css/chroma.css">
</head>
<body class="shithub-body">
{{ template "nav" . }}
{{ template "impersonation-banner" . }}
<main class="shithub-main">
{{ template "page" . }}
</main>
{{ template "footer" . }}
<script>
  // Click-to-copy on clone-dropdown buttons. Walk every button with
  // data-clone-copy="<selector>" and wire it once. Falls back to a
  // visual flash on the input when navigator.clipboard is unavailable
  // (older browsers, file:// dev pages, etc).
  (function () {
    var buttons = document.querySelectorAll("[data-clone-copy]");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sel = btn.getAttribute("data-clone-copy");
        var input = document.querySelector(sel);
        if (!input) return;
        var ok = false;
        try {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(input.value);
            ok = true;
          }
        } catch (e) { ok = false; }
        if (!ok) {
          input.select();
          try { document.execCommand("copy"); ok = true; } catch (e) {}
        }
        var prev = btn.getAttribute("title") || "";
        btn.setAttribute("title", ok ? "Copied" : "Press ⌘/Ctrl-C to copy");
        setTimeout(function () { btn.setAttribute("title", prev); }, 1200);
      });
    });
  })();

  (function () {
    var root = document.querySelector("[data-search-root]");
    if (!root) return;
    var input = root.querySelector("[data-search-input]");
    var panel = root.querySelector("[data-search-results]");
    if (!input || !panel || !window.fetch) return;

    var timer = 0;
    var controller = null;

    function closePanel() {
      panel.hidden = true;
      panel.innerHTML = "";
      input.setAttribute("aria-expanded", "false");
      if (controller) {
        controller.abort();
        controller = null;
      }
    }

    function showPanel(html) {
      panel.innerHTML = html;
      panel.hidden = false;
      input.setAttribute("aria-expanded", "true");
    }

    function loadSuggestions() {
      var query = input.value.trim();
      if (query.length < 2) {
        closePanel();
        return;
      }
      if (controller) controller.abort();
      controller = new AbortController();
      fetch("/search/quick?q=" + encodeURIComponent(query), {
        headers: { "X-Requested-With": "XMLHttpRequest" },
        signal: controller.signal
      }).then(function (response) {
        if (response.status === 204) return "";
        if (!response.ok) throw new Error("search quick failed");
        return response.text();
      }).then(function (html) {
        if (!html) {
          closePanel();
          return;
        }
        showPanel(html);
      }).catch(function (error) {
        if (error.name !== "AbortError") closePanel();
      });
    }

    function queueSuggestions() {
      window.clearTimeout(timer);
      timer = window.setTimeout(loadSuggestions, 160);
    }

    input.addEventListener("input", queueSuggestions);
    input.addEventListener("focus", function () {
      if (input.value.trim().length >= 2) queueSuggestions();
    });
    input.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closePanel();
        input.blur();
      }
    });
    root.addEventListener("submit", closePanel);
    document.addEventListener("click", function (event) {
      if (!root.contains(event.target)) closePanel();
    });
    document.addEventListener("keydown", function (event) {
      var active = document.activeElement;
      var editable = active && (
        active.tagName === "INPUT" ||
        active.tagName === "TEXTAREA" ||
        active.isContentEditable
      );
      if (event.key === "/" && !event.metaKey && !event.ctrlKey && !event.altKey && !editable) {
        event.preventDefault();
        input.focus();
        input.select();
      }
    });
  })();

  (function () {
    var modal = document.querySelector("[data-pins-modal]");
    if (!modal) return;

    var openers = document.querySelectorAll("[data-pins-open]");
    var closeButton = modal.querySelector("[data-pins-close]");
    var filter = modal.querySelector("[data-pins-filter]");
    var rows = Array.prototype.slice.call(modal.querySelectorAll("[data-pins-row]"));
    var checkboxes = Array.prototype.slice.call(modal.querySelectorAll("[data-pins-checkbox]"));
    var remaining = modal.querySelector("[data-pins-remaining]");
    var submit = modal.querySelector("[data-pins-submit]");

    function checkedCount() {
      return checkboxes.filter(function (box) { return box.checked; }).length;
    }

    function refreshPins() {
      var count = checkedCount();
      var left = Math.max(0, 6 - count);
      if (remaining) {
        remaining.textContent = String(left);
        remaining.parentElement.classList.toggle("is-full", left === 0);
      }
      if (submit) submit.disabled = count > 6;
      checkboxes.forEach(function (box) {
        box.disabled = !box.checked && count >= 6;
      });
    }

    function applyFilter() {
      if (!filter) return;
      var query = filter.value.trim().toLowerCase();
      rows.forEach(function (row) {
        var haystack = (row.getAttribute("data-pins-search") || "").toLowerCase();
        row.hidden = query !== "" && haystack.indexOf(query) === -1;
      });
    }

    function openModal() {
      modal.hidden = false;
      document.body.classList.add("shithub-modal-open");
      applyFilter();
      refreshPins();
      if (filter) filter.focus();
    }

    function closeModal() {
      modal.hidden = true;
      document.body.classList.remove("shithub-modal-open");
    }

    openers.forEach(function (button) {
      button.addEventListener("click", openModal);
    });
    if (closeButton) closeButton.addEventListener("click", closeModal);
    modal.addEventListener("click", function (event) {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !modal.hidden) closeModal();
    });
    if (filter) filter.addEventListener("input", applyFilter);
    checkboxes.forEach(function (box) {
      box.addEventListener("change", refreshPins);
    });
    refreshPins();
  })();
</script>
</body>
</html>
{{- end }}
