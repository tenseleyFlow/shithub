{{ define "layout" -}}
<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <script>
    // Theme flash avoidance: read the cookie or system preference and apply
    // before any CSS computes. The four themes are: light, dark, auto,
    // high-contrast (S10 wires the picker; S02 just enforces the contract).
    (function () {
      var match = document.cookie.match(/(?:^|; )theme=([^;]+)/);
      var theme = match ? decodeURIComponent(match[1]) : "auto";
      if (theme === "auto") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="shithub — GitHub. Open source. Without Copilot.">
  {{ if .OGTitle }}<meta property="og:title" content="{{ .OGTitle }}">{{ end }}
  {{ if .OGDescription }}<meta property="og:description" content="{{ .OGDescription }}">{{ end }}
  {{ if .OGImage }}<meta property="og:image" content="{{ .OGImage }}">{{ end }}
  <title>{{ .Title }} · shithub</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo/favicon.svg">
  <link rel="stylesheet" href="/static/primer/primer.css" onerror="this.remove()">
  <link rel="stylesheet" href="/static/css/shithub.css">
  <link rel="stylesheet" href="/static/css/chroma.css">
</head>
<body class="shithub-body">
{{ template "nav" . }}
<main class="shithub-main">
{{ template "page" . }}
</main>
{{ template "footer" . }}
<script>
  // Click-to-copy on clone-dropdown buttons. Walk every button with
  // data-clone-copy="<selector>" and wire it once. Falls back to a
  // visual flash on the input when navigator.clipboard is unavailable
  // (older browsers, file:// dev pages, etc).
  (function () {
    var buttons = document.querySelectorAll("[data-clone-copy]");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sel = btn.getAttribute("data-clone-copy");
        var input = document.querySelector(sel);
        if (!input) return;
        var ok = false;
        try {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(input.value);
            ok = true;
          }
        } catch (e) { ok = false; }
        if (!ok) {
          input.select();
          try { document.execCommand("copy"); ok = true; } catch (e) {}
        }
        var prev = btn.getAttribute("title") || "";
        btn.setAttribute("title", ok ? "Copied" : "Press ⌘/Ctrl-C to copy");
        setTimeout(function () { btn.setAttribute("title", prev); }, 1200);
      });
    });
  })();
</script>
</body>
</html>
{{- end }}
