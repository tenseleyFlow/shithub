---
# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Base hardening: apt baseline, ufw, fail2ban-lite, system users.

- name: Apt — install baseline packages
  apt:
    name:
      - curl
      - wget
      - ca-certificates
      - ufw
      - fail2ban
      - sudo
      - git
      - jq
      - rsync
      - rclone        # cross-region Spaces sync (S37)
      - tzdata
      - unattended-upgrades
      - python3-psycopg2  # community.postgresql modules need this
    state: present
    update_cache: yes

- name: Timezone — pin to UTC for log + cron sanity
  community.general.timezone:
    name: UTC

- name: Unattended security upgrades — enable
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: UFW — defaults
  ufw:
    direction: incoming
    policy: deny
- name: UFW — allow ssh
  ufw: { rule: allow, port: "22", proto: tcp }
- name: UFW — allow http (Caddy redirect to https)
  ufw: { rule: allow, port: "80", proto: tcp }
- name: UFW — allow https
  ufw: { rule: allow, port: "443", proto: tcp }
- name: UFW — allow wireguard
  ufw: { rule: allow, port: "51820", proto: udp }
- name: UFW — enable
  ufw: { state: enabled }

- name: System users — create shithub (web/worker)
  user:
    name: "{{ shithub_user }}"
    system: yes
    home: "/var/lib/shithub"
    shell: /usr/sbin/nologin
    create_home: yes

- name: System users — create shithub-ssh (AKC)
  user:
    name: shithub-ssh
    system: yes
    home: /var/lib/shithub-ssh
    shell: /usr/sbin/nologin
    create_home: yes

# The `git` user is the SSH login target sshd matches against in the
# sshd_config Match-User-git block. Its shell can't be nologin (sshd
# rejects), but the AuthorizedKeysCommand returns a key with a forced
# `command=` prefix that overrides whatever a login shell would do.
# /usr/bin/git-shell adds a second layer of constraint: even if the
# AKC's command= is somehow bypassed, git-shell only allows git
# commands.
- name: Ensure git-shell is installed (provided by `git` package, already a dep)
  command: which git-shell
  register: git_shell
  changed_when: false

- name: System users — create git (SSH login target)
  user:
    name: git
    system: yes
    home: /var/lib/git
    shell: "{{ git_shell.stdout }}"
    create_home: yes

- name: Data root — create + own
  file:
    path: "{{ shithub_data_root }}"
    state: directory
    owner: "{{ shithub_user }}"
    group: "{{ shithub_group }}"
    mode: "0755"

# Caddy access log carries the real client IP (Caddy terminates TLS
# and shithubd only ever sees 127.0.0.1 over the loopback proxy).
# This filter scans Caddy's JSON-formatted access log for failed
# auth attempts. Field order in Caddy's JSON output is stable in
# practice; the regex is deliberately substring-anchored so the
# `<HOST>` group always lands on the request.remote_ip value.
- name: fail2ban — shithubd auth filter (Caddy access log)
  copy:
    dest: /etc/fail2ban/filter.d/shithubd-auth.conf
    content: |
      [Definition]
      failregex = ^.*"remote_ip":"<HOST>".*?"method":"POST".*?"uri":"/(login|signup|password/reset|password/forgot|2fa(/[^"]*)?|settings/security/2fa/[^"]*)".*?"status":(401|403|429)\b
      ignoreregex =
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban — jail config (sshd + shithubd-auth)
  copy:
    dest: /etc/fail2ban/jail.d/shithub.local
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      findtime = 600
      bantime = 3600

      # Bans clients that hammer the auth surface past the app-level
      # throttle. The per-user throttle in internal/auth/throttle stops
      # password guessing; this jail stops the network noise BEFORE
      # the request reaches the proxy, freeing connection slots.
      # Slightly more lenient than sshd because legitimate users may
      # legitimately fail the 2FA challenge once or twice.
      [shithubd-auth]
      enabled  = true
      filter   = shithubd-auth
      logpath  = /var/log/caddy/access.log
      maxretry = 8
      findtime = 600
      bantime  = 3600
      backend  = auto
    mode: "0644"
  notify: restart fail2ban

# AIDE file-integrity monitoring lives in its own task file so the
# nightly-check + baseline-init noise doesn't clutter the main flow.
- name: AIDE file-integrity monitoring
  import_tasks: aide.yml
