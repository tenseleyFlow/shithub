#
# Runner-only provisioning playbook for DigitalOcean Actions runner pools.
# Use this with inventories generated by deploy/doctl so runner hosts do not
# need to parse unrelated app/database/edge roles from site.yml.

- hosts: actions_runners
  become: yes
  gather_facts: yes
  roles:
    - role: shithubd-runner
      tags: [shithubd-runner, actions-runner]
      when: shithub_runner_enabled | default(false) | bool
